name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Public CI runs on synthetic fixtures only. It never downloads, caches or
# uploads official IEC NSD packages (see docs/licensing.md).

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      policy-version: v1.4.2
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      codecov-name: go-iec61850-model
      go-versions: '["1.26", "1.27"]'
      test-exclude-regex: "(/example(s)?($|/)|/internal/fixtures$)"
    secrets: inherit

  # nsdctl is a nested module (ADR-0009): the root run does not reach it.
  cli:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      policy-version: v1.4.2
      module-dir: cmd/nsdctl
      test-exclude-regex: "/example(s)?($|/)"
      run-govulncheck: true
      coverage-min: "90"
      run-codecov: false
      go-versions: '["1.26", "1.27"]'
    secrets: inherit

  # Per-package floor (TEST-012). go-ci enforces the total only.
  package-coverage:
    name: Per-package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check
