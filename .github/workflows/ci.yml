name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Public CI runs on synthetic fixtures only. It never downloads, caches or
# uploads official IEC NSD packages (see docs/licensing.md).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2
    with:
      codecov-name: go-iec61850-model
      go-versions: '["1.24", "1.25", "1.26"]'
      test-exclude-regex: "(/example(s)?($|/)|/internal/fixtures$)"
    secrets: inherit
