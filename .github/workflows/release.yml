name: Release

run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release-package:
    uses: otfabric/.github/.github/workflows/go-package-release.yml@v3.1.1
    with:
      bump: ${{ inputs.bump }}
      release-name-prefix: go-iec61850-model
      update-major-tag: false
    secrets: inherit

  release-nsdctl-binary:
    needs: release-package
    uses: otfabric/.github/.github/workflows/go-binary-release.yml@v3.1.1
    with:
      bump: none
      binary-name: nsdctl
      module-dir: cmd/nsdctl
      main-path: .
      targets: '["linux/amd64","linux/arm64","linux/arm/v7","darwin/amd64","darwin/arm64","windows/amd64","windows/arm64"]'
      ldflags: "-s -w -X main.version=${VERSION} -X main.tag=${TAG} -X main.commit=${COMMIT} -X main.buildDate=${BUILD_DATE}"
      run-tests: false
    secrets: inherit
